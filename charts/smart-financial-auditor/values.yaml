# Default values for smart-financial-auditor.

replicaCount: 1

image:
  repository: ghcr.io/mykolapylypenko/smart-financial-auditor
  pullPolicy: IfNotPresent
  # Overridden by CI/CD tag
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: smart-auditor.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 1024Mi
  # requests:
  #   cpu: 250m
  #   memory: 512Mi

# ─── Application Configuration ───────────────────────────────────────────────
env:
  spring_profiles_active: "local"
  # Set to true if using internal postgres/ollama
  use_internal_services: true

# ─── PostgreSQL (pgvector) ───────────────────────────────────────────────────
postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  database: financial_auditor
  username: postgres
  password: "strongpassword" # Should be in secret
  persistence:
    enabled: true
    size: 1Gi

# ─── Ollama ──────────────────────────────────────────────────────────────────
ollama:
  enabled: true
  image: ollama/ollama:latest
  keepAlive: "24h"
  models:
    - llama3.2
    - nomic-embed-text
  persistence:
    enabled: true
    size: 10Gi
  # GPU support for K3s (optional, depends on runtime)
  gpu:
    enabled: false
