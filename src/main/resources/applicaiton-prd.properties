# ─── Spring AI: OpenAI ──────────────────────────────────────────────────────
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-not-configured}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.model.chat=openai
spring.ai.model.embedding=openai

# ─── LangChain4j: OpenAI ────────────────────────────────────────────────────
# LangChain4j manages its own 'document_embeddings' table for the /audit/query endpoint
langchain4j.openai.api-key=${OPENAI_API_KEY:sk-not-configured}
langchain4j.openai.chat-model=gpt-4o
langchain4j.openai.embedding-model=text-embedding-3-small
langchain4j.openai.temperature=0.0

# ─── LangChain4j: Vector store ──────────────────────────────────────────────
langchain4j.embedding.dimension=1536
langchain4j.chat.provider=openai

