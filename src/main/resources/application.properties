spring.profiles.active=local

spring.application.name=smart-financial-auditor
server.port=8080

# ─── Database ───────────────────────────────────────────────────────────────
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/financial_auditor}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── Flyway ─────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ─── Java 21 Virtual Threads ────────────────────────────────────────────────
spring.threads.virtual.enabled=true

# ─── File Upload ────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ─── Spring AI: Model selection (overridden per profile) ────────────────────
# Disable unused model types globally so their auto-configurations never load
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none

# ─── Spring AI: PgVector Store ──────────────────────────────────────────────
# Spring AI manages its own 'vector_store' table for the /audit/spring-ai endpoint
spring.ai.vectorstore.pgvector.index-type=hnsw
spring.ai.vectorstore.pgvector.distance-type=cosine_distance
spring.ai.vectorstore.pgvector.initialize-schema=true

# ─── Actuator ───────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Smart Financial Auditor
info.app.description=AI-powered banking regulatory compliance auditor
info.app.version=0.0.1-SNAPSHOT
