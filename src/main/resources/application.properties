spring.application.name=smart-financial-auditor
server.port=8080

# ─── Database ───────────────────────────────────────────────────────────────
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/financial_auditor}
spring.datasource.username=${DATASOURCE_USERNAME:postgres}
spring.datasource.password=${DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── Flyway ─────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ─── Java 21 Virtual Threads ────────────────────────────────────────────────
spring.threads.virtual.enabled=true

# ─── File Upload ────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ─── Spring AI: OpenAI ──────────────────────────────────────────────────────
spring.ai.openai.api-key=${OPENAI_API_KEY:sk-not-configured}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.embedding.options.model=text-embedding-3-small

# ─── Spring AI: Ollama (local alternative) ──────────────────────────────────
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=llama3.2

# ─── Spring AI: PgVector Store ──────────────────────────────────────────────
# Spring AI manages its own 'vector_store' table for the /audit/spring-ai endpoint
spring.ai.vectorstore.pgvector.index-type=hnsw
spring.ai.vectorstore.pgvector.distance-type=cosine_distance
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.initialize-schema=true

# ─── LangChain4j: OpenAI ────────────────────────────────────────────────────
# LangChain4j manages its own 'document_embeddings' table for the /audit/query endpoint
langchain4j.openai.api-key=${OPENAI_API_KEY:sk-not-configured}
langchain4j.openai.chat-model=gpt-4o
langchain4j.openai.embedding-model=text-embedding-3-small
langchain4j.openai.temperature=0.0

# ─── LangChain4j: Ollama (local alternative) ────────────────────────────────
langchain4j.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
langchain4j.ollama.chat-model=llama3.2

# ─── LangChain4j: Vector store ──────────────────────────────────────────────
langchain4j.embedding.dimension=1536
langchain4j.chat.provider=openai

# ─── Actuator ───────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Smart Financial Auditor
info.app.description=AI-powered banking regulatory compliance auditor
info.app.version=0.0.1-SNAPSHOT
