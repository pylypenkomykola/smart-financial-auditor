# ─── Spring AI: Ollama ──────────────────────────────────────────────────────
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.embedding.model=nomic-embed-text

spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama

# ─── LangChain4j: Ollama (local alternative) ────────────────────────────────
langchain4j.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
langchain4j.ollama.chat-model=llama3.2

# ─── LangChain4j: Vector store ──────────────────────────────────────────────
langchain4j.embedding.dimension=1536
langchain4j.chat.provider=ollama